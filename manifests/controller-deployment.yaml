apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameoflife-controller
  namespace: gameoflife
  labels:
    app: gameoflife
    component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameoflife
      component: controller
  template:
    metadata:
      labels:
        app: gameoflife
        component: controller
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: controller
        image: 192.168.68.100:5000/gameoflife-controller:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: REGION_ID
          value: "k3s-cluster"
        - name: PORT
          value: "8081"
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 5
      # Prefer AMD64 nodes for controller performance
      nodeSelector:
        kubernetes.io/arch: amd64
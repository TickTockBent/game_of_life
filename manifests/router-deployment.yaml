apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameoflife-router
  namespace: gameoflife
  labels:
    app: gameoflife
    component: router
spec:
  replicas: 2  # Run 2 router instances for high availability
  selector:
    matchLabels:
      app: gameoflife
      component: router
  template:
    metadata:
      labels:
        app: gameoflife
        component: router
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: router
        image: 192.168.68.100:5000/gameoflife-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: CONTROLLER_ENDPOINT
          value: "http://gameoflife-controller:8081"
        - name: REGION_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gameoflife-router
  namespace: gameoflife
  labels:
    app: gameoflife
    component: router
spec:
  selector:
    app: gameoflife
    component: router
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
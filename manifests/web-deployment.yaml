apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameoflife-web
  namespace: gameoflife
  labels:
    app: gameoflife
    component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gameoflife
      component: web
  template:
    metadata:
      labels:
        app: gameoflife
        component: web
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: web
        image: 192.168.68.100:5000/gameoflife-web:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: CONTROLLER_URL
          value: "http://192.168.68.100:8082"
        - name: PORT
          value: "8080"
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /api/topology
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/topology
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      # Prefer AMD64 nodes for web frontend performance
      nodeSelector:
        kubernetes.io/arch: amd64
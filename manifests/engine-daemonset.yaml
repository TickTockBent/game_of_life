apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: gameoflife-engine
  namespace: gameoflife
  labels:
    app: gameoflife
    component: engine
spec:
  selector:
    matchLabels:
      app: gameoflife
      component: engine
  template:
    metadata:
      labels:
        app: gameoflife
        component: engine
    spec:
      imagePullSecrets:
      - name: registry-secret
      containers:
      - name: engine
        image: registry.ticktockbent.com/gameoflife-engine:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: CONTROLLER_URL
          value: "http://gameoflife-controller.gameoflife.svc.cluster.local:8081"
        - name: SELF_ENDPOINT
          value: "http://$(POD_IP):8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      # Tolerate all taints so engine runs on every node
      tolerations:
      - operator: Exists
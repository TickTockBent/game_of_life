---
apiVersion: v1
kind: Service
metadata:
  name: gameoflife-controller
  namespace: gameoflife
  labels:
    app: gameoflife
    component: controller
spec:
  selector:
    app: gameoflife
    component: controller
  ports:
  - name: http
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: gameoflife-web
  namespace: gameoflife
  labels:
    app: gameoflife
    component: web
spec:
  selector:
    app: gameoflife
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP

---
# Headless service for engine pods (for direct pod-to-pod communication)
apiVersion: v1
kind: Service
metadata:
  name: gameoflife-engine
  namespace: gameoflife
  labels:
    app: gameoflife
    component: engine
spec:
  selector:
    app: gameoflife
    component: engine
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  clusterIP: None  # Headless service
  type: ClusterIP
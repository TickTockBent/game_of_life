<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal · Distributed Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--fg:#000;--rule:#000;--muted:#bbb;--accent:#000;--card-bg:#000;--card-fg:#fff;--radius:0;--sw-radius:0;
 --canvas-bg:#fff;--cell-dead:transparent;--slot-empty:#ccc;--section-border:#e6e6e6;--owner-sat:90;--owner-light:50;
 --display:'Archivo Black',Impact,sans-serif;--body:'Archivo',system-ui,sans-serif;--mono:'Archivo',system-ui,sans-serif;
 --h1:400 1.4rem/1 var(--display);--h2:700 .7rem/1 var(--body);--num:400 2rem/1 var(--display)}
:root.is-dark{--bg:#000;--fg:#fff;--rule:#fff;--muted:#444;--accent:#fff;--card-bg:#fff;--card-fg:#000;--canvas-bg:#000;--slot-empty:#333;--section-border:#1c1c1c}
header{border-bottom-width:3px}
aside{border-left-width:3px}
header h1{text-transform:uppercase}
aside h2{text-transform:uppercase;letter-spacing:.1em;opacity:1}
#themeToggle{border-width:2px;font-weight:700;text-transform:uppercase;font-size:.7rem}
#card{border-width:0}
@media (max-width:720px){aside{border-top-width:3px}}

/* ---- shared layout ---- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:grid;grid-template-columns:1fr minmax(240px,300px);grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/-1;display:flex;align-items:baseline;gap:1rem;padding:.9rem 1.4rem;border-bottom:1px solid var(--rule)}
header h1{font:var(--h1);margin:0}
header .sub{opacity:.65;font-size:.85rem}
header .spacer{flex:1}
#themeToggle{font:inherit;font-size:.8rem;background:none;border:1px solid var(--rule);color:inherit;padding:.3rem .7rem;border-radius:var(--radius);cursor:pointer}
#themeToggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#conn{width:.55rem;height:.55rem;border-radius:50%;background:var(--muted);display:inline-block;align-self:center}
#conn[data-state=live]{background:var(--accent)}
main{position:relative;display:grid;place-items:center;padding:clamp(.5rem,3vw,2rem);min-height:0}
#life{display:block;max-width:100%;cursor:crosshair}
aside{border-left:1px solid var(--rule);padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:1.4rem;overflow:auto}
aside h2{font:var(--h2);margin:0 0 .5rem;opacity:.7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.8rem 1rem}
.stat b{display:block;font:var(--num)}
.stat span{font-size:.75rem;opacity:.6}
#participants{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
#participants li{display:flex;align-items:center;gap:.6rem;font-size:.88rem}
#participants li.lag{opacity:.45}
#participants .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#participants .ago{font-size:.72rem;opacity:.55;font-family:var(--mono)}
#participants .none{opacity:.6}
.sw{width:.7rem;height:.7rem;border-radius:var(--sw-radius,2px);display:inline-block;flex:none}
#card[hidden]{display:none}
#card{position:fixed;pointer-events:none;background:var(--card-bg);color:var(--card-fg);border:1px solid var(--rule);padding:.55rem .75rem;border-radius:var(--radius);font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:.2rem;z-index:10}
#card b{display:flex;align-items:center;gap:.5rem}
#card small{opacity:.65;font-family:var(--mono);font-size:.72rem}
.hint{font-size:.75rem;opacity:.55;line-height:1.4}
@media (max-width:720px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}aside{border-left:0;border-top:1px solid var(--rule);flex-direction:row;flex-wrap:wrap}aside>*{flex:1 1 45%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1>Signal</h1>
  <span class="sub">100 engines max. 4 generations per second. One grid.</span>
  <span class="spacer"></span>
  <span id="conn" title="connection"></span>
  <button id="themeToggle" type="button">Light / dark</button>
</header>
<main><canvas id="life" aria-label="Live Game of Life grid"></canvas></main>
<aside>
  <section><h2>Now</h2>
    <div class="stats">
      <div class="stat"><b id="gen">–</b><span>generation</span></div>
      <div class="stat"><b id="rate">–</b><span>gen / s</span></div>
      <div class="stat"><b id="engines">–</b><span>engines</span></div>
      <div class="stat"><b id="cells">–</b><span>cells</span></div>
    </div>
  </section>
  <section><h2>Computing this grid</h2><ul id="participants"></ul></section>
  <p class="hint">Cells are black or white, full stop. The coloured bar under each block says whose engine it is. Faded bars are catching up. Click to reseed.</p>
</aside>
<div id="card" hidden></div>
<script src="/static/life-core.js?v=5"></script>
<script>LifeView.mount({
  shape:'square', gap:0.12, ringOfEmpty:1,
  aliveStyle(ctx,node,alpha,view){ return view.tokens.dark ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`; },
  // identity lives in a thick coloured underline per section, not in the cells
  drawSection(ctx,x,y,s,node,view){ ctx.save(); ctx.fillStyle=`hsla(${view.hue(node)},${view.tokens.sat}%,${view.tokens.light}%,${node.lagging?.3:1})`; ctx.fillRect(x+2,y+s-Math.max(2,s*0.035),s-4,Math.max(2,s*0.035)); ctx.restore(); },
  hoverStyle(ctx,x,y,s,node,view){ ctx.save(); ctx.strokeStyle=`hsl(${view.hue(node)},90%,50%)`; ctx.lineWidth=3; ctx.strokeRect(x+1.5,y+1.5,s-3,s-3); ctx.restore(); }
});
</script>
</body>
</html>
